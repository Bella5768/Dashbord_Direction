{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}
{% block page_subtitle %}Projet : {{ project.name }} | Jalon : {{ milestone.name }}{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px;">
    <div class="card-header">
        <h3 class="card-title">{{ title }}</h3>
    </div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            
            <div class="form-group" style="margin-bottom: 20px;">
                <label for="id_name">Nom de la sous-étape *</label>
                <input type="text" name="name" id="id_name" class="form-control" 
                       value="{{ form.name.value|default:'' }}" required
                       placeholder="Ex: Rédiger le cahier des charges">
            </div>
            
            <div class="form-group" style="margin-bottom: 20px;">
                <label for="id_assigned_to">Responsable</label>
                <select name="assigned_to" id="id_assigned_to" class="form-control">
                    <option value="">-- Aucun responsable --</option>
                    {% for employee in form.assigned_to.field.queryset %}
                    <option value="{{ employee.id }}" {% if form.assigned_to.value|stringformat:"s" == employee.id|stringformat:"s" %}selected{% endif %}>
                        {{ employee.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="grid grid-2" style="gap: 16px; margin-bottom: 20px;">
                <div class="form-group">
                    <label for="id_order">Ordre</label>
                    <input type="number" name="order" id="id_order" class="form-control" 
                           value="{{ form.order.value|default:0 }}" min="0" style="width: 100px;">
                </div>
                
                <div class="form-group">
                    <label style="display: block; margin-bottom: 8px;">Statut</label>
                    <label class="remember-me" style="cursor: pointer; display: flex; gap: 8px; align-items: center;">
                        <input type="checkbox" name="completed" {% if form.completed.value %}checked{% endif %}>
                        <span>Complétée</span>
                    </label>
                </div>
            </div>
            
            <div class="flex gap-3" style="margin-top: 24px;">
                <button type="submit" class="btn btn-primary">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="16" height="16">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                    {% if sub_milestone %}Enregistrer{% else %}Créer la sous-étape{% endif %}
                </button>
                <a href="{% url 'core:project_detail' project.id %}" class="btn btn-outline">Annuler</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
