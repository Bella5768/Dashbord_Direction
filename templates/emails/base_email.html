{% load i18n %}<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background:#f3f4f6;font-family:Arial,sans-serif;">
<div style="max-width:620px;margin:20px auto;">

  <!-- Banner -->
  <div style="background:{{ banner_color|default:'#1e3a5f' }};color:white;padding:22px 20px;text-align:center;border-radius:8px 8px 0 0;">
    <img src="cid:csig_logo" alt="CSIG" height="44" style="display:block;margin:0 auto 10px;">
    <h2 style="margin:0;font-size:18px;letter-spacing:.3px;">{{ banner_title }}</h2>
    {% if banner_subtitle %}<p style="margin:5px 0 0;font-size:13px;opacity:.9;">{{ banner_subtitle }}</p>{% endif %}
  </div>

  <!-- Content -->
  <div style="background:#f9fafb;padding:28px 24px;border:1px solid #e5e7eb;border-top:none;">
    {% block content %}{% endblock %}
  </div>

  <!-- Footer -->
  <div style="background:#f3f4f6;padding:14px 20px;text-align:center;font-size:12px;color:#6b7280;border:1px solid #e5e7eb;border-top:none;border-radius:0 0 8px 8px;">
    <p style="margin:0;">© {% now "Y" %} CSIG &ndash; Centre de Suivi et d'Information de Gestion</p>
    <p style="margin:4px 0 0;font-size:11px;">Email automatique &mdash; merci de ne pas répondre.</p>
  </div>

</div>
</body>
</html>
