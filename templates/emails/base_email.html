{% load i18n %}<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'fr' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background:#f3f4f6;font-family:Arial,sans-serif;">
<div style="max-width:620px;margin:20px auto;background:#ffffff;border:1px solid #e5e7eb;border-radius:8px;overflow:hidden;">

  <!-- En-tête officiel CSIG (papier en-tête) -->
  <img src="cid:csig_header" alt="CSIG" width="620" style="display:block;width:100%;height:auto;">

  <!-- Bandeau contextuel -->
  <div style="background:{{ banner_color|default:'#003366' }};color:white;padding:16px 20px;text-align:center;">
    <h2 style="margin:0;font-size:17px;letter-spacing:.3px;">{{ banner_title }}</h2>
    {% if banner_subtitle %}<p style="margin:5px 0 0;font-size:13px;opacity:.9;">{{ banner_subtitle }}</p>{% endif %}
  </div>

  <!-- Content -->
  <div style="background:#f9fafb;padding:28px 24px;">
    {% block content %}{% endblock %}
  </div>

  <!-- Pied de page officiel CSIG -->
  <img src="cid:csig_footer" alt="CSIG &ndash; {% trans "Centre de Suivi et d'Information de Gestion" %}" width="620" style="display:block;width:100%;height:auto;">

</div>
<p style="max-width:620px;margin:8px auto 0;text-align:center;font-size:11px;color:#6b7280;">
  {% trans "Email automatique — merci de ne pas répondre." %}
</p>
</body>
</html>
