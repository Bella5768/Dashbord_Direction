{% extends "emails/base_email.html" %}
{% load i18n %}
{% block content %}
    <h2>{{ title }}</h2>

    <p>{% trans 'Bonjour' %} {{ username }},</p>

    <p>{{ message }}</p>

    {% if action_link %}
    <p style="text-align: center;">
        <a href="{{ action_link }}" class="button">{{ action_text|default:_("Voir les détails") }}</a>
    </p>
    {% endif %}

    <p>{% trans 'Cordialement,' %}<br>{% trans "L'équipe CSIG" %}</p>
{% endblock %}
